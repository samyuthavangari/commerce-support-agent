name: Evaluation Pipeline & Regression Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      fast_mode:
        description: 'Run fast verification (stratified 30 sample)'
        type: boolean
        default: false

jobs:
  eval:
    name: Test, Leakage Gate & Replay Evaluation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Offline Unit Tests (27/27)
        run: |
          python -m pytest tests/ -q

      - name: Verify Zero Data Leakage Gate
        run: |
          python scripts/checks/check_leakage.py --no-docker --no-retrieval

      - name: Run Evaluation in Replay Mode
        run: |
          python run_eval.py --resume --no-judge --baselines --no-docker

      - name: Render Results Table to Job Summary
        run: |
          python scripts/checks/render_summary.py

      - name: Upload Evaluation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-artifacts
          path: |
            results/eval_report.json
            results/confusion_matrix.png
            results/agent_replies.csv
